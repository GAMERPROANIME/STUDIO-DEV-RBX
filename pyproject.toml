[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibridge-ai"
version = "1.0.0"
description = "OMNIBRIDGE AI — Universal MCP: autonomous agent engine, knowledge engine, Roblox Studio integration, browser bridge and dashboard (Python-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "roblox", "luau", "agents", "rag", "automation"]
dependencies = [
    "mcp>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
omnibridge = "omnibridge.main:main"
omnibridge-bridge = "omnibridge.bridge.install:main"

[tool.setuptools.packages.find]
include = ["omnibridge*"]

[tool.setuptools.package-data]
omnibridge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["omnibridge"]
omit = ["omnibridge/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
